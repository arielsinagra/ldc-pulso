name: posiciones

on:
  schedule:
    - cron: "40 5 * * *"       # diario 05:40 UTC; el protocolo del LP System revisa cada 48 h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  posiciones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer posiciones y generar dashboard
        run: python3 lp_posiciones.py --out .
      - name: Publicar
        run: |
          git config user.name  "ldc-posiciones[bot]"
          git config user.email "ldc-posiciones@users.noreply.github.com"
          git add posiciones.md posiciones.json dashboard.html
          if git diff --cached --quiet; then
            echo "sin cambios que publicar"
          else
            git commit -m "posiciones $(date -u +%F) (actions)"
            git pull --rebase --autostash
            git push
          fi
